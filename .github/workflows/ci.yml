name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS is the primary target: the app is a menubar client and the Wails
    # build needs the platform webview toolchain.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: gofmt
        run: |
          # Scoped to our own sources; the generated build/ scaffolding is not
          # ours to reformat.
          unformatted=$(gofmt -l . ./internal 2>/dev/null | grep -v '^build/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt drift in:"; echo "$unformatted"; exit 1
          fi

      # The frontend must be built before ANY Go step. main.go embeds
      # frontend/dist with `//go:embed`, and that directive fails at type-check
      # time when the directory is absent — breaking `go vet` and `go build`
      # with a confusing "pattern ... no matching files found".
      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      # The web dashboard is the product; the menubar is a shell around it.
      # internal/web must therefore stay buildable without a desktop, so a
      # headless daemon can serve the same UI. This is a check rather than a
      # convention because the failure is a one-line convenience import that
      # nobody would flag in review.
      #
      # Wails v3 alpha2.118's Linux layer does not compile at all
      # ("undefined: pointer" across pkg/application/*_linux.go), so a single
      # import anywhere under internal/app or internal/web takes the whole
      # cross-build down — the build below IS most of the assertion. The
      # go list check is the early-warning half: it goes red on an import
      # that happens to compile.
      #
      # Must be GOOS=linux scoped. On darwin this same command prints 22,
      # because internal/app/service_wails.go is compiled in — that file is
      # the one sanctioned Wails surface of package app.
      - name: Dashboard stays portable
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build ./internal/app/... ./internal/web/... ./internal/herdr/...
          reached=$(GOOS=linux GOARCH=amd64 go list -deps ./internal/web/... | grep 'wailsapp/wails' || true)
          if [ -n "$reached" ]; then
            echo "::error::internal/web reaches Wails on linux:"; echo "$reached"; exit 1
          fi

      - name: Go test
        # Tests requiring a live herdr socket skip automatically when none is
        # present, so this stays green on CI runners.
        run: go test ./... -count=1 -race

      - name: Package binary
        run: go build -o bin/merino .

      # v6 is the first major whose action.yml declares `using: node24`; v5
      # declares node20, which the runner now force-upgrades with a
      # deprecation warning. Not v7: that adds an `archive` input and changes
      # what `name` means when archive is false, which is a separate call.
      # Nothing downloads this in-workflow, so no download-artifact to pair.
      - uses: actions/upload-artifact@v6
        with:
          name: merino-macos
          path: bin/merino
          retention-days: 7
