name: Image

# Deliberately NOT wired to the `v*` tag push that cuts a release.
#
# Publishing a container image is a new distribution channel with its own
# supply-chain surface, its own package visibility settings, and its own
# failure mode: a broken image build should not be able to fail — or silently
# half-finish — the macOS release that people actually install today. Adding
# `push: tags: ["v*"]` below is a one-line change once the maintainer decides
# the image is something this project ships rather than something it can build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to stamp into the binary (e.g. v0.3.0)"
        required: true
      push:
        description: "Push to ghcr.io (unchecked = build only, verifying the Dockerfile still works)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: merinod image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only granted when actually pushing; a build-only run has no business
      # holding write on the package registry.
      packages: ${{ inputs.push && 'write' || 'read' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 and linux/arm64 because the two plausible homes for this
      # are a NAS or VPS (amd64) and a Raspberry Pi or Graviton node (arm64).
      # The frontend stage runs on BUILDPLATFORM and the Go stage
      # cross-compiles, so neither arch pays for emulation.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.merinod
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          build-args: |
            VERSION=${{ inputs.tag }}
          tags: |
            ghcr.io/loneexile/merinod:${{ inputs.tag }}
            ghcr.io/loneexile/merinod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A push that reported success but produced an image the registry
      # cannot serve is the failure worth catching here, so pull each one
      # back and run it. `version` exits non-zero if the binary is broken.
      #
      # Both platforms, not just the runner's: the arm64 image is
      # cross-compiled and never executed during the build, so without the
      # emulated run below a broken arm64 binary would ship tagged `latest`
      # with nothing having tried to start it. QEMU is already installed
      # above, so this costs one emulated process spawn.
      - name: Verify the published images run
        if: inputs.push
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$platform"
            docker run --rm --pull=always --platform "$platform" \
              ghcr.io/loneexile/merinod:${{ inputs.tag }} version
            echo "::endgroup::"
          done
