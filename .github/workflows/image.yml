name: Image

# Publishes ghcr.io/loneexile/merinod on every `v*` tag, alongside the release
# workflow rather than inside it: a broken image build must not be able to fail
# — or silently half-finish — the macOS release that people actually install.
#
# Pre-release tags (v0.3.0-rc.1) publish their own version tag but deliberately
# do NOT move `latest`, so a release candidate cannot become what a bare
# `docker pull` hands out.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to stamp into the binary (e.g. v0.3.0)"
        required: true
      push:
        description: "Push to ghcr.io (unchecked = build only, verifying the Dockerfile still works)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: merinod image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # A tag push always publishes; a manual run only when asked, so the
      # Dockerfile can be exercised without touching the registry.
      - name: Resolve version and whether to push
        id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            version="${GITHUB_REF#refs/tags/}"
            push=true
          else
            version="${{ inputs.tag }}"
            push="${{ inputs.push }}"
          fi

          # Semver says anything after a hyphen is a pre-release. Those get
          # their own tag and nothing else — `latest` keeps pointing at the
          # newest stable, which is what an unpinned pull expects.
          #
          # The tag list is assembled here rather than with a conditional
          # expression in the `tags:` block, because that leaves a blank line
          # in the list when the condition is false and whether the action
          # tolerates one is not worth finding out during a release.
          repo=ghcr.io/loneexile/merinod
          tags="${repo}:${version}"
          case "$version" in
            *-*) ;;
            *)   tags="${tags}"$'\n'"${repo}:latest" ;;
          esac

          {
            echo "version=$version"
            echo "push=$push"
            echo 'tags<<TAGS_EOF'
            printf '%s\n' "$tags"
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "version=$version push=$push"
          printf 'tags:\n%s\n' "$tags"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.v.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 and linux/arm64 because the two plausible homes for this
      # are a NAS or VPS (amd64) and a Raspberry Pi or Graviton node (arm64).
      # The frontend stage runs on BUILDPLATFORM and the Go stage
      # cross-compiles, so neither arch pays for emulation.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.merinod
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.push == 'true' }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A push that reported success but produced an image the registry cannot
      # serve is the failure worth catching here, so pull each one back and run
      # it. `version` exits non-zero if the binary is broken.
      #
      # Both platforms, not just the runner's: the arm64 image is
      # cross-compiled and never executed during the build, so without the
      # emulated run below a broken arm64 binary would ship with nothing having
      # tried to start it. QEMU is already installed above, so this costs one
      # emulated process spawn.
      #
      # It also proves the package is actually pullable, which is a separate
      # thing from the push reporting success — a private package publishes
      # fine and then 401s for everyone else. Anonymous pull is not exercised
      # here (the runner is still logged in), so check the package visibility
      # in the GitHub UI after the first publish.
      - name: Verify the published images run
        if: steps.v.outputs.push == 'true'
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$platform"
            docker run --rm --pull=always --platform "$platform" \
              "ghcr.io/loneexile/merinod:${{ steps.v.outputs.version }}" version
            echo "::endgroup::"
          done
