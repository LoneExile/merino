name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_dispatch must build the tag being published, not main HEAD.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Test
        run: |
          go test ./... -race -count=1
          cd frontend && npm run typecheck

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.118
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package .app
        # just package = frontend build + wails3 package. CI already ran npm ci;
        # wails3 package embeds frontend/dist into the macOS bundle.
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd frontend && npm run build && cd ..
          # Inject version so desktop CheckUpdate matches the release tag.
          go build -ldflags "-X main.version=${VERSION#v}" -o bin/herdr-tunnel .
          wails3 package

      - name: Stage artefacts
        run: |
          mkdir -p dist
          if [ -d bin/herdr-tunnel.app ]; then
            ditto -c -k --sequesterRsrc --keepParent bin/herdr-tunnel.app dist/herdr-tunnel-macos.zip
          elif [ -d build/bin/herdr-tunnel.app ]; then
            ditto -c -k --sequesterRsrc --keepParent build/bin/herdr-tunnel.app dist/herdr-tunnel-macos.zip
          fi
          # Also ship the bare binary if the package step left one.
          for f in bin/herdr-tunnel build/bin/herdr-tunnel; do
            if [ -f "$f" ]; then
              cp "$f" dist/herdr-tunnel-darwin-arm64
              chmod +x dist/herdr-tunnel-darwin-arm64
              break
            fi
          done
          ls -la dist
          test -n "$(ls -A dist)" || { echo "no artefacts staged"; exit 1; }
          (cd dist && shasum -a 256 * > SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
