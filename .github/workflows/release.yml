name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Merino $TAG ($VERSION)"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      # Must build frontend before any Go step: main.go embeds frontend/dist.
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Go test
        run: go test ./... -race -count=1

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.118
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package .app
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CGO_ENABLED: "1"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          set -euo pipefail
          # Stamp CFBundle versions before bundling (create:app:bundle copies Info.plist).
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" build/darwin/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" build/darwin/Info.plist

          # Versioned production binary. Do NOT run `wails3 package` — that task
          # depends on darwin:build which rebuilds WITHOUT -X main.version and
          # would overwrite bin/merino with 0.1.0-dev.
          mkdir -p bin
          go build -tags production -trimpath -buildvcs=false             -ldflags="-w -s -X main.version=${VERSION}"             -o bin/merino .

          # Bundle only (icons + Info.plist + ad-hoc codesign).
          wails3 task darwin:create:app:bundle

          test -d bin/merino.app
          # APFS is often case-insensitive: cannot mv merino.app → Merino.app in place.
          # Ship merino.app (matches CFBundleExecutable / Homebrew cask).
          cp "bin/merino.app/Contents/MacOS/merino" bin/merino
          chmod +x bin/merino
          strings "bin/merino.app/Contents/MacOS/merino" | grep -F "${VERSION}" | head -3 || true

      - name: Stage artefacts
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64) ARCH_LABEL=arm64 ;;
            x86_64) ARCH_LABEL=amd64 ;;
            *) ARCH_LABEL="$ARCH" ;;
          esac

          ditto -c -k --sequesterRsrc --keepParent bin/merino.app \
            "dist/Merino-${VERSION}-macos-${ARCH_LABEL}.zip"

          cp bin/merino "dist/merino-${VERSION}-darwin-${ARCH_LABEL}"
          chmod +x "dist/merino-${VERSION}-darwin-${ARCH_LABEL}"

          # Stable names (latest-friendly) for docs / brew livecheck helpers.
          cp "dist/Merino-${VERSION}-macos-${ARCH_LABEL}.zip" \
            "dist/merino-macos-${ARCH_LABEL}.zip"
          cp "dist/merino-${VERSION}-darwin-${ARCH_LABEL}" \
            "dist/merino-darwin-${ARCH_LABEL}"

          (cd dist && shasum -a 256 * > SHA256SUMS)
          ls -la dist
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Merino ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional auto-bump of LoneExile/homebrew-merino.
  # Create a classic PAT with `repo` on the tap, add it as secret HOMEBREW_TAP_TOKEN.
  bump-homebrew:
    name: Bump Homebrew cask
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - name: Skip without token
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN not set — bump the cask manually after release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        if: steps.gate.outputs.skip == 'false'
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip == 'false'
        with:
          repository: LoneExile/homebrew-merino
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Patch cask from release assets
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          API="repos/LoneExile/merino/releases/tags/${TAG}"
          # gh downloads over HTTPS without dumping bodies into the log.
          ARM_NAME=$(gh api "$API" --jq '.assets[].name' | grep -E 'macos-arm64\.zip$' | head -1)
          test -n "$ARM_NAME"
          gh release download "$TAG" -R LoneExile/merino -p "$ARM_NAME" -D /tmp/assets
          ARM_SHA=$(sha256sum "/tmp/assets/$ARM_NAME" | awk '{print $1}')
          CASK=tap/Casks/merino.rb
          python3 - "$VERSION" "$ARM_SHA" "$CASK" <<'PY'
          import pathlib, re, sys
          ver, arm, path = sys.argv[1:4]
          p = pathlib.Path(path)
          t = p.read_text()
          t = re.sub(r'version "[^"]+"', f'version "{ver}"', t)
          t = re.sub(r'sha256 "[0-9a-fA-F]+"', f'sha256 "{arm}"', t)
          p.write_text(t)
          print(p.read_text())
          PY

      - name: Commit and push
        if: steps.gate.outputs.skip == 'false'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/merino.rb
          git diff --cached --quiet && echo "no cask changes" && exit 0
          git commit -m "chore: merino ${{ steps.ver.outputs.version }}"
          git push
