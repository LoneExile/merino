name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

# Least privilege per job, not one blanket grant: only the release job writes
# anything here. bump-homebrew reads this repo (release assets) and writes to
# the tap using its own PAT, so it has no business holding write on this one.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS package
    runs-on: macos-latest
    permissions:
      contents: write # creates the GitHub Release and uploads assets
    outputs:
      # The Homebrew job below needs this to keep the cask off a release
      # candidate; job outputs are the only way across the job boundary.
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          # An action input, not a shell word: safe to interpolate.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: ver
        # Through env, never interpolated into the script. A ${{ }} expression
        # is pasted in as raw text before the shell parses the line, so a
        # dispatch input containing a quote executes the rest as commands — in
        # a job that holds a write token. GITHUB_REF_NAME is the built-in
        # equivalent of github.ref_name.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          # Semver says anything after a hyphen is a pre-release: v0.3.0-rc.1.
          # This decides two things that must not be got wrong, because both
          # reach people who never asked for a release candidate:
          #
          #   GitHub's /releases/latest serves the newest release that is NOT
          #   flagged pre-release, and both install scripts resolve exactly
          #   that. An unflagged RC becomes what every `| bash` hands out.
          #
          #   The Homebrew cask bump below would move the tap to the RC.
          case "$VERSION" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building Merino $TAG ($VERSION), prerelease=$prerelease"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      # Must build frontend before any Go step: internal/assets embeds
      # internal/assets/dist, which vite writes (frontend build.outDir).
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Go test
        run: go test ./... -race -count=1

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.118
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package .app
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CGO_ENABLED: "1"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          set -euo pipefail
          # Stamp CFBundle versions before bundling (create:app:bundle copies Info.plist).
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" build/darwin/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" build/darwin/Info.plist

          # Versioned production binary. Do NOT run `wails3 package` — that task
          # depends on darwin:build which rebuilds WITHOUT -X main.version and
          # would overwrite bin/merino with 0.1.0-dev.
          mkdir -p bin
          go build -tags production -trimpath -buildvcs=false             -ldflags="-w -s -X main.version=${VERSION}"             -o bin/merino ./cmd/merino

          # Bundle only (icons + Info.plist + ad-hoc codesign).
          wails3 task darwin:create:app:bundle

          test -d bin/merino.app
          # APFS is often case-insensitive: cannot mv merino.app → Merino.app in place.
          # Ship merino.app (matches CFBundleExecutable / Homebrew cask).
          cp "bin/merino.app/Contents/MacOS/merino" bin/merino
          chmod +x bin/merino
          strings "bin/merino.app/Contents/MacOS/merino" | grep -F "${VERSION}" | head -3 || true

      - name: Stage artefacts
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64) ARCH_LABEL=arm64 ;;
            x86_64) ARCH_LABEL=amd64 ;;
            *) ARCH_LABEL="$ARCH" ;;
          esac

          ditto -c -k --sequesterRsrc --keepParent bin/merino.app \
            "dist/Merino-${VERSION}-macos-${ARCH_LABEL}.zip"

          cp bin/merino "dist/merino-${VERSION}-darwin-${ARCH_LABEL}"
          chmod +x "dist/merino-${VERSION}-darwin-${ARCH_LABEL}"

          # Stable names (latest-friendly) for docs / brew livecheck helpers.
          cp "dist/Merino-${VERSION}-macos-${ARCH_LABEL}.zip" \
            "dist/merino-macos-${ARCH_LABEL}.zip"
          cp "dist/merino-${VERSION}-darwin-${ARCH_LABEL}" \
            "dist/merino-darwin-${ARCH_LABEL}"

          # merinod — the headless daemon. Without these, installing it means
          # having a Go toolchain, which is not an install method.
          #
          # Cross-compiled here rather than in a Linux job because the
          # frontend is already built in this one and merinod embeds it, and
          # CGO_ENABLED=0 makes each target a static binary with no libc to
          # match.
          #
          # Linux only, deliberately. On darwin the build pulls in
          # internal/app/service_wails.go, which needs Wails' pkg/mac and
          # therefore cgo, so a CGO_ENABLED=0 darwin build does not compile at
          # all. macOS is served by the menu bar app, which runs the same
          # dashboard — anyone who genuinely wants the daemon on a Mac can
          # `go build ./cmd/merinod` with cgo on.
          for target in linux/amd64 linux/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            out="dist/merinod-${VERSION}-${goos}-${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -buildvcs=false \
                -ldflags="-w -s -X main.version=${VERSION}" \
                -o "$out" ./cmd/merinod
            chmod +x "$out"
            # Stable name so scripts/install-merinod.sh can fetch from
            # /releases/latest/download/ without knowing the version.
            cp "$out" "dist/merinod-${goos}-${goarch}"
          done

          (cd dist && shasum -a 256 * > SHA256SUMS)
          ls -la dist
          cat dist/SHA256SUMS

      # Release notes come from CHANGELOG.md, not from generate_release_notes.
      # The generated list is flat and ungrouped, and it cannot carry a
      # hand-written upgrade note. Sourcing the body from the committed file
      # means the repo and the release page cannot disagree — and the step
      # fails loudly if the section is missing, rather than shipping a release
      # with empty notes because nobody ran `just changelog`.
      - name: Release notes from CHANGELOG
        id: notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # Resolve the body BEFORE opening the heredoc. Writing the opening
          # delimiter and then failing leaves GITHUB_OUTPUT unterminated, and
          # the runner reports "Unable to process file command 'output'"
          # instead of the real error — which is how a missing `tac` on the
          # macOS runner showed up as a confusing second failure.
          BODY=$(./scripts/release-notes.sh "$TAG")
          {
            echo 'body<<RELEASE_NOTES_EOF'
            printf '%s\n' "$BODY"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # Pinned to a commit, not a tag. This is the only third-party action
        # here and it receives a token that can write to this repository; a
        # mutable tag lets whoever controls it point that token at new code.
        # Renovate still bumps SHA pins and keeps the comment in step.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Merino ${{ steps.ver.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          # Defaults to false, which would have published v0.3.0-rc.1 as an
          # ordinary release. GitHub then serves it from /releases/latest,
          # which is precisely what both install scripts resolve — so an
          # unflagged candidate becomes what every `| bash` installs. The
          # action's own docs: "Drafts and prereleases cannot be set as
          # latest", so this one field is the whole guard.
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional auto-bump of LoneExile/homebrew-merino.
  #
  # Needs a fine-grained PAT as secret HOMEBREW_TAP_TOKEN:
  #   Resource owner:     LoneExile
  #   Repository access:  only LoneExile/homebrew-merino
  #   Permissions:        Contents: Read and write   (Metadata read is forced)
  #
  # Not a classic PAT with `repo`, which this comment used to recommend: that
  # grants write to every repository the owner has, to edit one file in one
  # tap. Nothing here needs Actions — the asset download below uses the
  # automatic GITHUB_TOKEN, not this one.
  bump-homebrew:
    name: Bump Homebrew cask
    needs: macos
    # A release candidate must not move the tap. `brew upgrade --cask merino`
    # is an unpinned pull: whoever runs it gets whatever the cask points at,
    # and nobody typing that is asking to test a candidate. Stable tags only.
    if: needs.macos.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip without token
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # An annotation, not just a log line. Every step below is gated on
            # skip=false, so without this the job reports a green tick having
            # done nothing — indistinguishable from a successful bump on the
            # run summary. The cask sat five releases stale behind that tick
            # before anyone looked at the tap.
            echo "::warning title=Homebrew cask NOT bumped::HOMEBREW_TAP_TOKEN is not set. The cask still points at the previous version — bump it manually."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        if: steps.gate.outputs.skip == 'false'
        id: ver
        # Same reasoning as the macOS job: through env, never pasted into the
        # script. This job holds the tap PAT, so the stakes are higher here.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          TAG="${TAG#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip == 'false'
        with:
          repository: LoneExile/homebrew-merino
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Patch cask from release assets
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          API="repos/LoneExile/merino/releases/tags/${TAG}"
          # gh downloads over HTTPS without dumping bodies into the log.
          ARM_NAME=$(gh api "$API" --jq '.assets[].name' | grep -E 'macos-arm64\.zip$' | head -1)
          test -n "$ARM_NAME"
          gh release download "$TAG" -R LoneExile/merino -p "$ARM_NAME" -D /tmp/assets
          ARM_SHA=$(sha256sum "/tmp/assets/$ARM_NAME" | awk '{print $1}')
          CASK=tap/Casks/merino.rb
          python3 - "$VERSION" "$ARM_SHA" "$CASK" <<'PY'
          import pathlib, re, sys
          ver, arm, path = sys.argv[1:4]
          p = pathlib.Path(path)
          t = p.read_text()
          t, nver = re.subn(r'version "[^"]+"', f'version "{ver}"', t)
          t, nsha = re.subn(r'sha256 "[0-9a-fA-F]+"', f'sha256 "{arm}"', t)
          # A regex that matches nothing rewrites nothing, and the commit step
          # then reports "no cask changes" and exits 0 — a green run leaving a
          # stale cask. If the cask's shape ever drifts from these patterns,
          # say so here instead.
          if nver != 1 or nsha != 1:
              sys.exit(f"cask patch matched {nver} version and {nsha} sha256 lines, expected 1 each: {path} has drifted")
          p.write_text(t)
          print(p.read_text())
          PY

      - name: Commit and push
        if: steps.gate.outputs.skip == 'false'
        working-directory: tap
        # VERSION derives from the tag, so a crafted dispatch input reaches
        # this line too. Same treatment as the other two: env, not ${{ }}.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/merino.rb
          git diff --cached --quiet && echo "no cask changes" && exit 0
          git commit -m "chore: merino ${VERSION}"
          git push
