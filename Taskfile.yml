version: '3'

vars:
  APP_NAME: "merino"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  # Server mode (`-tags server`, Dockerfile.server) was deliberately
  # removed: it started a second HTTP server on a hardcoded :8080 serving the
  # dashboard SPA with no login page, while every auth gate in this project
  # lives in internal/web. It also ran the tray animator with no menu bar and
  # initialised a GitHub updater inside a container. The supported headless
  # path is cmd/merinod (`go build ./cmd/merinod`), which has one gated HTTP
  # surface. `wails3 task common:update:build-assets` may regenerate the
  # scaffold from the upstream template — do not reintroduce it.
  #
  # setup:docker survives in build/Taskfile.yml: that image cross-COMPILES
  # native binaries and is unrelated to the container that was unsafe.

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker
