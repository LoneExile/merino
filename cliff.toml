# Changelog generation from Conventional Commits.
#
#   just changelog          regenerate CHANGELOG.md for every tag
#   just changelog-preview  what the NEXT release would say
#
# CHANGELOG.md is the source of truth for release notes: the release workflow
# extracts the section matching the tag and posts it as the GitHub release
# body. That means what you read in the repo and what you read on the release
# page cannot drift, and a hand-written upgrade note added to a section ships
# with it.

[changelog]
header = """
# Changelog

Notable changes per release. Format follows [Conventional Commits](https://www.conventionalcommits.org);
this file is generated by [git-cliff](https://git-cliff.org) with `just changelog`.
"""

# Renders one section per tag. Kept close to Keep a Changelog so the file reads
# well on its own, since the release page shows the same text.
body = """
{% if version %}
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** — {% endif %}{% if commit.scope %}**{{ commit.scope }}** — {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""

trim = false

# git-cliff's Tera swallows the newline after a block tag, so blank lines
# written in the template above never survive. Rather than fight the template,
# put them back on the finished text: one blank line before every heading.
# The markdown renders either way; this is so the committed file is readable.
postprocessors = [
  { pattern = '(?m)^(#{2,3} )', replace = "\n$1" },
  # …then collapse whatever that doubled up.
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = true
# Anything that is not a conventional commit is dropped rather than dumped
# into a catch-all: an unparseable subject in a changelog is noise, and the
# fix is to write the commit properly.
filter_unconventional = true
protect_breaking_commits = true
split_commits = false
tag_pattern = "v[0-9]*"
# Pre-release tags get no section of their own. Semver: anything after a
# hyphen is a pre-release, so v0.3.0-rc.1 is a candidate for v0.3.0, not a
# release anyone upgrades to — its changes belong in the 0.3.0 section.
#
# Without this, cutting an RC splits the history in two: the rc tag takes
# every commit since the last stable, and the stable release that follows
# gets whatever landed after it — usually nothing. scripts/release-notes.sh
# refuses to publish an empty section, so the real release would fail at the
# last step, after the build, with the fix being a hand edit.
ignore_tags = "v[0-9]+\\.[0-9]+\\.[0-9]+-"
topo_order = false
sort_commits = "oldest"

commit_parsers = [
  # Breaking is NOT a group. git-cliff already flags it per commit (a `!`
  # after the type, or a BREAKING CHANGE footer) and the template marks those
  # inline — a `body` regex here matched every commit and swallowed the lot.
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
]

# No commit_preprocessors on purpose. They run BEFORE parsing, so stripping
# the "fix(tray):" prefix here would leave nothing for conventional_commits
# to match and every commit would be skipped as unparseable. With conventional
# parsing on, `commit.message` in the template is already the bare
# description, which is what the body above renders.
